<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Scoop · Automated warm-up prototype</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="shell">
    <nav class="rail">
      <div class="rail-logo" title="Scoop">T<span>Scoop</span></div>
      <div class="rail-nav">
        <button class="rail-item" data-rail="oak">
          <svg viewBox="0 0 24 24"><path d="M4 16l6-10 4 6 3-4 3 8H4z"/></svg>
          <span>Oak</span>
        </button>
        <button class="rail-item" data-rail="storydash">
          <svg viewBox="0 0 24 24"><path d="M4 6h12l4 4v8H4z"/><path d="M16 6v4h4"/></svg>
          <span>Story Dash</span>
        </button>
        <button class="rail-item" data-rail="liveadmin">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M4 12h4M16 12h4"/></svg>
          <span>Live Admin</span>
        </button>
        <button class="rail-item is-active" data-rail="all">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
          <span>All</span>
        </button>
      </div>
      <div class="rail-bottom">
        <button class="rail-item" data-rail="help">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 1-1 1.7v.5"/><circle cx="12" cy="17" r=".3"/></svg>
        </button>
        <div class="avatar">EL</div>
      </div>
    </nav>

    <div class="main">
      <header class="topbar">
        <div class="breadcrumb" id="breadcrumb"></div>
      </header>
      <div class="tabs" id="tabsRow"></div>
      <main class="content" id="app"></main>
    </div>
  </div>

  <!-- New upload modal -->
  <div class="overlay" id="uploadOverlay">
    <div class="modal">
      <div class="modal-header">
        <h2>New upload</h2>
        <button class="icon-btn" id="closeUploadModal" aria-label="Close">✕</button>
      </div>
      <div class="modal-body">
        <label class="field">
          <span class="field-label">Signup form version</span>
          <input type="text" id="fSignupVersion" placeholder="Bulk_VendorName_TimePeriod" value="Bulk_VendorName_TimePeriod" />
        </label>
        <label class="field">
          <span class="field-label">Newsletter / product</span>
          <select id="fProduct">
            <option value="" disabled selected>Select...</option>
            <option>Love Letter</option>
            <option>The World</option>
            <option>Breaking News</option>
            <option>The Good List</option>
            <option>On Tech</option>
            <option>The Morning</option>
            <option>Well</option>
          </select>
        </label>
        <label class="field">
          <span class="field-label">Send cadence</span>
          <select id="fCadence">
            <option value="" disabled selected>Select...</option>
            <option>Daily</option>
            <option>Weekly</option>
            <option>Biweekly</option>
            <option>Monthly</option>
          </select>
        </label>
        <label class="field">
          <span class="field-label">BigQuery table</span>
          <input type="text" id="fBigQuery" placeholder="my-project.my-dataset.my-table" />
          <span class="field-hint">Must include a regi_id column and grant read access to nyt-messaging-prd@appspot.gserviceaccount.com. 500k row max.</span>
        </label>
        <label class="checkbox-row">
          <input type="checkbox" id="fEmailConfirm" />
          <span>Send email confirmation</span>
        </label>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="cancelUpload">Cancel</button>
        <button class="btn btn-primary" id="submitUpload">Analyze table</button>
      </div>
    </div>
  </div>

  <!-- Row detail slide-over panel -->
  <aside class="panel" id="panel">
    <div class="panel-header">
      <div class="panel-title">
        <h2 id="panelName">—</h2>
      </div>
      <button class="icon-btn" id="closePanel" aria-label="Close">✕</button>
    </div>
    <div class="panel-body" id="panelBody"></div>
    <div class="panel-footer" id="panelFooter"></div>
  </aside>

  <script src="app.js"></script>
</body>
</html>
